<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toddler Transducer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='player.css') }}" rel="stylesheet">
    <style>
      .track-list { max-height: 300px; overflow-y: auto; margin-top: 12px; }
      .track-list .list-group-item {
        cursor: pointer; border-radius: 0; border-left: 3px solid transparent;
      }
      .track-list .list-group-item:hover { background: #f0f0f0; }
      .track-list .list-group-item.active-track {
        border-left-color: #0e0e0e; background: #e8e8e8; font-weight: 600;
      }
      .player-icon-btn {
        background: none; border: none; cursor: pointer;
        width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; transition: background 0.15s;
      }
      .player-icon-btn:hover { background: #e0e0e0; }
      .player-icon-btn svg { width: 22px; height: 22px; fill: #0e0e0e; }
      .player-icon-btn.loop-active { background: #0e0e0e; }
      .player-icon-btn.loop-active svg { color: #fff; }
      .player-icon-btn.puck-locked { background: #8b0000; }
      .player-icon-btn.puck-locked svg { color: #fff; }
      .volume-wrap { display: flex; align-items: center; gap: 6px; width: 120px; }
      .volume-wrap input[type=range] { flex: 1; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Toddler Transducer</h1>
        <div class="row">
            <!-- Player (left half) -->
            <div class="col-6">
                <div class="player">
                    <div class="player-track-meta">
                        <p id="trackName">{{track_name}}</p>
                    </div>

                    <!-- Progress / Timeline -->
                    <div class="player-timeline">
                        <span class="player-time player-time-current" id="timeCurrent">{{play_current_time}}</span>
                        <div class="player-progress" id="progressWrapper">
                            <div class="player-progress-filled" id="progressFilled"></div>
                        </div>
                        <span class="player-time player-time-duration" id="timeDuration">{{play_track_length}}</span>
                    </div>

                    <!-- Playback Controls -->
                    <div class="player-controls d-flex justify-content-center align-items-center gap-2 mt-2">
                        <button class="player-icon-btn" id="prevBtn" title="Previous Track">
                            <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4"/><rect x="5" y="4" width="2" height="16"/></svg>
                        </button>

                        <button class="player-icon-btn" id="playBtn" title="Play / Pause" style="width:48px;height:48px;">
                            <svg viewBox="0 0 24 24" id="playIcon">
                                <polygon class="icon-play" points="19.05 12 6 3.36 6 20.64 19.05 12"/>
                            </svg>
                            <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none;">
                                <rect x="6" y="3.26" width="4" height="17.48"/>
                                <rect x="14" y="3.26" width="4" height="17.48"/>
                            </svg>
                        </button>

                        <button class="player-icon-btn" id="nextBtn" title="Next Track">
                            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20"/><rect x="17" y="4" width="2" height="16"/></svg>
                        </button>

                        <button class="player-icon-btn {{loop_icon_class}}" id="loopBtn" title="Toggle Loop">
                            <svg viewBox="0 0 24 24">
                                <path d="M17 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/>
                                <path d="M7 22l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="2"/>
                                <path d="M7 6h10a4 4 0 0 1 4 4v2" fill="none" stroke="currentColor" stroke-width="2"/>
                                <path d="M17 18H7a4 4 0 0 1-4-4v-2" fill="none" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>

                        <button class="player-icon-btn" id="puckLockoutBtn" title="Toggle Puck Lockout">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 8a5 5 0 0 1 10 0v4l2 7H5l2-7V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
                            </svg>
                        </button>

                        <div class="volume-wrap">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="#0e0e0e">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="#0e0e0e" stroke-width="2"/>
                            </svg>
                            <input type="range" class="player-volume" id="volumeSlider" min="0" max="100" value="{{volume}}">
                        </div>
                    </div>

                    <!-- Track List -->
                    <div class="track-list" id="trackList">
                        <input type="text" class="form-control form-control-sm mb-2" id="trackFilter" placeholder="Filter tracks..." oninput="filterTrackList()">
                        <div class="list-group" id="trackListGroup">
                            {% for track in playable_tracks %}
                            <button type="button" class="list-group-item list-group-item-action py-1" data-track="{{track}}">{{track}}</button>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Upload / Admin (right half) -->
            <div class="col-6" style="text-align: center;">
                <h2>Upload New Track</h2>
                <form action="/upload_track" method="post">
                    <input type="submit" name="UpdatePuckID" value="Update Puck ID"><br>
                </form>
                <h4>{{current_puck_id}}</h4>
                <form action="/upload_track" method="post" enctype = "multipart/form-data">
                    <label for="TrackName" class="form-label">Track Name</label>
                    <input type="text" class="form-control" id="TrackName" placeholder="IllMakeAManOutOfYou" name="TrackName"><br>

                    <label for="TrackFile">File to upload:</label>
                    <input type="file" id="TrackFile" name="TrackFile">

                    <input type="submit" name="UploadFile" value="Upload">
                </form>
                <h2>Download Backup</h2>
                <form action="/backup_audio" method="get">
                    <input type="submit" name="DownloadBackup" value="Download Backup"><br>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="{{ url_for('static', filename='player.js') }}"></script>
</body>
</html>
